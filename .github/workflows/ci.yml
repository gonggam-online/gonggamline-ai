name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-lint:
    name: ci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint

  ci-typecheck:
    name: ci-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck --if-present

  ci-tests:
    name: ci-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test --if-present

  ci-db-baseline-replay:
    name: ci-db-baseline-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Start disposable Supabase stack
        run: |
          diagnostic_migration=/tmp/023_product_security_target.sql
          mv supabase/migrations/023_product_security_target.sql "$diagnostic_migration"
          if ! supabase start; then
            mv "$diagnostic_migration" supabase/migrations/023_product_security_target.sql
            exit 1
          fi
          mv "$diagnostic_migration" supabase/migrations/023_product_security_target.sql
      - name: Replay the complete migration chain
        run: supabase db reset --local
      - name: Diagnose disposable R1 predicates after replay failure
        if: failure()
        run: |
          docker exec -i supabase_db_gonggamline-ai-sprint-b0 \
            psql -U postgres -d postgres --no-psqlrc --quiet --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "BEGIN READ ONLY; WITH product_state AS (SELECT CASE WHEN NOT c.relrowsecurity AND (SELECT count(*) FROM pg_catalog.pg_policies WHERE schemaname='public' AND tablename='products')=0 THEN 'CANONICAL_000_022' WHEN c.relrowsecurity AND (SELECT count(*) FROM pg_catalog.pg_policies WHERE schemaname='public' AND tablename='products')=3 THEN 'RESTORED_DRIFT' ELSE 'UNKNOWN' END AS pre_state FROM pg_catalog.pg_class c WHERE c.oid='public.products'::regclass), expected(function_name,function_oid,canonical_service_execute) AS (VALUES ('product_mutation_claim_v1',to_regprocedure('public.product_mutation_claim_v1(text,text,text,text,uuid)')::oid,false),('product_mutation_complete_v1',to_regprocedure('public.product_mutation_complete_v1(uuid,bigint,jsonb,uuid,text,text,uuid)')::oid,false),('import_product_v1',to_regprocedure('public.import_product_v1(jsonb,text,text,uuid,uuid)')::oid,true),('patch_product_operator_fields_v1',to_regprocedure('public.patch_product_operator_fields_v1(bigint,timestamptz,jsonb,text,text,uuid,uuid)')::oid,true),('record_product_competition_v1',to_regprocedure('public.record_product_competition_v1(bigint,timestamptz,jsonb,text,text,text,uuid,uuid,text)')::oid,false),('record_manual_competition_analysis_v1',to_regprocedure('public.record_manual_competition_analysis_v1(bigint,timestamptz,jsonb,text,text,uuid,uuid)')::oid,true),('record_automatic_competition_analysis_v1',to_regprocedure('public.record_automatic_competition_analysis_v1(bigint,timestamptz,jsonb,text,text,uuid,uuid,text)')::oid,true)) SELECT concat('R2_CI_R1_PREDICATE_MATRIX|pre_state=',ps.pre_state,'|',string_agg(format('%s|contract_match=%s|PUBLIC=%s/%s|anon=%s/%s|authenticated=%s/%s|service_role=%s/%s',e.function_name,(pg_catalog.pg_get_userbyid(p.proowner)='postgres' AND p.prosecdef AND p.proconfig @> ARRAY['search_path=pg_catalog, public']),EXISTS(SELECT 1 FROM pg_catalog.aclexplode(coalesce(p.proacl,pg_catalog.acldefault('f',p.proowner))) acl WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE'),false,has_function_privilege('anon',p.oid,'EXECUTE'),ps.pre_state='RESTORED_DRIFT',has_function_privilege('authenticated',p.oid,'EXECUTE'),ps.pre_state='RESTORED_DRIFT',has_function_privilege('service_role',p.oid,'EXECUTE'),CASE WHEN ps.pre_state='RESTORED_DRIFT' THEN true ELSE e.canonical_service_execute END),';' ORDER BY e.function_name)) FROM expected e JOIN pg_catalog.pg_proc p ON p.oid=e.function_oid CROSS JOIN product_state ps GROUP BY ps.pre_state; ROLLBACK;"
      - name: Stop and discard disposable stack
        if: always()
        run: supabase stop --no-backup

  ci-item-selection-security:
    name: ci-item-selection-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: npm ci
      - name: Replay 000-021 and verify A01-A12
        shell: pwsh
        run: ./scripts/verify-item-selection-security-slice.ps1 -Start -Stop

  ci-r1-atomic-product-mutation:
    name: ci-r1-atomic-product-mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Replay 000-022 and verify atomic mutation behavior
        shell: pwsh
        run: ./scripts/verify-r1-atomic-product-mutation.ps1 -Start -Stop

  ci-build:
    name: ci-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build

  ci-security-audit:
    name: ci-security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Reject tracked secrets and generated output
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.next/|out/|build/|playwright-report/|test-results/)' | grep -v '^\.env\.local\.example$' || true)"
          test -z "$forbidden" || { echo "Forbidden tracked files:"; echo "$forbidden"; exit 1; }
          git grep -nEI '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!package-lock.json' && exit 1 || true
      - name: Reject newly introduced explicit any
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.ts' '*.tsx' |
            grep '^+' | grep -v '^+++' | grep -E '(:|<|as)[[:space:]]*any\b' && exit 1 || true
